services:
  backend:
    build: ./backend
    ports:
      # The frontend is served on port 5173 (see the frontend service below);
      # ALLOWED_ORIGINS must match whatever host:port the browser loads it from.
      - "8080:8080"
    environment:
      # Comma-separated list of origins allowed by CORS. Defaults to just
      # http://localhost:5173. To also allow access from other machines on
      # the network, set ALLOWED_ORIGINS (e.g. via a .env file) to
      # "http://localhost:5173,http://<your-machine-ip>:5173"
      # (see DOCKER.md for details).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Credenciais do único usuário da aplicação (autenticação simples).
      # Troque isso em qualquer uso fora da sua máquina local (ver DOCKER.md).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
