services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minikb
      POSTGRES_USER: minikb
      POSTGRES_PASSWORD: minikb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria um segundo banco ("minikb_test") só para os testes
      # automatizados, isolado dos dados de verdade da aplicação.
      - ./backend/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      # Exposto no host (5432) só para facilitar rodar `go test` fora do
      # container, apontando DATABASE_URL para localhost. Não é
      # necessário para a aplicação em si, que fala com o Postgres pela
      # rede interna do Compose (hostname "postgres").
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minikb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      # The frontend is served on port 5173 (see the frontend service below);
      # ALLOWED_ORIGINS must match whatever host:port the browser loads it from.
      - "8080:8080"
    environment:
      # String de conexão do Postgres. "postgres" aqui é o hostname do
      # serviço acima, resolvido pela rede interna do Docker Compose — não
      # precisa ser "localhost". No Railway, essa variável é preenchida
      # automaticamente ao conectar o addon de Postgres ao serviço.
      DATABASE_URL: postgres://minikb:minikb@postgres:5432/minikb?sslmode=disable
      # Comma-separated list of origins allowed by CORS. Defaults to just
      # http://localhost:5173. To also allow access from other machines on
      # the network, set ALLOWED_ORIGINS (e.g. via a .env file) to
      # "http://localhost:5173,http://<your-machine-ip>:5173"
      # (see DOCKER.md for details).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Credenciais do único usuário da aplicação (autenticação simples).
      # Troque isso em qualquer uso fora da sua máquina local (ver DOCKER.md).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
